<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" fill="none" role="img" aria-label="Natera">
  <title>Natera</title>
  <!-- Four overlapping translucent circles forming the venn-style mark -->
  <g transform="translate(8 8)">
    <circle cx="40" cy="20" r="20" fill="#00A0DC" fill-opacity="0.95"/>
    <circle cx="20" cy="40" r="20" fill="#A3E635" fill-opacity="0.95"/>
    <circle cx="60" cy="40" r="20" fill="#00A0DC" fill-opacity="0.95"/>
    <circle cx="40" cy="60" r="20" fill="#A3E635" fill-opacity="0.95"/>
    <!-- Soft center cross overlay to echo the venn intersections -->
    <path d="M40 20 L40 60 M20 40 L60 40"
          stroke="#0a4a3b" stroke-width="0.75" stroke-opacity="0.35"/>
  </g>
  <!-- "natera" wordmark in Natera blue with small ® -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="500" fill="#00A0DC">
    <text x="110" y="74" font-size="74" letter-spacing="-2">natera</text>
    <text x="310" y="34" font-size="16" letter-spacing="0">®</text>
  </g>
</svg>
